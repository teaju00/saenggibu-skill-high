<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학생부 바이트 계산기</title>
<style>
  :root {
    --bg: #f7f6f2; --panel: #ffffff; --ink: #1f2328; --muted: #5d636b;
    --line: #d9d6cc; --accent: #2f5d8a; --ok: #2e7d4f; --warn: #a15c00; --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17191c; --panel: #1f2226; --ink: #e6e6e3; --muted: #a2a7ad;
      --line: #3a3e44; --accent: #7fb0e0; --ok: #6cc28f; --warn: #e0a64a; --bad: #f08a82;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.6 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.note { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
  label { display: block; font-weight: 600; margin: 12px 0 6px; }
  select, textarea { width: 100%; font: inherit; color: var(--ink); background: var(--panel);
                     border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  textarea { min-height: 240px; resize: vertical; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > div { flex: 1 1 160px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
           gap: 10px; margin-top: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  .card .k { color: var(--muted); font-size: 13px; }
  .card .v { font-size: 22px; font-weight: 700; }
  .bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; margin-top: 16px; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--ok); }
  ul#msgs { margin: 12px 0 0; padding-left: 20px; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  input[type=number] { width: 100%; font: inherit; color: var(--ink); background: var(--panel);
                       border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
</style>
</head>
<body>
<main>
  <h1>학생부 바이트 계산기</h1>
  <p class="note">2026학년도 고등학교 기재요령 기준: 한글 1자 3Byte, 영문·숫자·공백 1Byte, 엔터 1Byte. 그 밖의 문자는 3Byte로 보수적으로 셉니다. 입력한 글은 이 컴퓨터 밖으로 나가지 않습니다(인터넷 연결 없이 동작).</p>

  <div class="row">
    <div>
      <label for="item">항목</label>
      <select id="item">
        <option value="1500">과목별 세부능력 및 특기사항 (최대 1,500)</option>
        <option value="1500">개인별 세부능력 및 특기사항 (최대 1,500)</option>
        <option value="1500">창체 자율·자치 / 동아리 / 진로 (최대 1,500)</option>
        <option value="1500">1·2학년 공통과목 1·2 합산 (최대 1,500)</option>
        <option value="1500">전공실무과목 학기별 (최대 1,500)</option>
        <option value="900">행동특성 및 종합의견 (최대 900)</option>
      </select>
    </div>
    <div>
      <label for="target">목표 Byte</label>
      <input id="target" type="number" min="1" step="1" value="1500">
    </div>
  </div>

  <label for="text">초안</label>
  <textarea id="text" placeholder="여기에 초안을 붙여 넣으세요."></textarea>

  <div class="bar"><span id="fill"></span></div>
  <div class="stats">
    <div class="card"><div class="k">Byte</div><div class="v" id="bytes">0</div></div>
    <div class="card"><div class="k">한글 환산</div><div class="v" id="hangul">0자</div></div>
    <div class="card"><div class="k">목표 대비</div><div class="v" id="ratio">0%</div></div>
    <div class="card"><div class="k">최대 대비</div><div class="v" id="maxr">0%</div></div>
  </div>
  <ul id="msgs"></ul>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const item = $("item"), target = $("target"), text = $("text");

  function neisBytes(s) {
    s = s.replace(/\r\n/g, "\n");
    let n = 0;
    for (const ch of s) {
      n += ch === "\n" || ch === "\r" || ch.codePointAt(0) < 128 ? 1 : 3;
    }
    return n;
  }

  function checks(s) {
    const out = [];
    if (/[一-鿿㐀-䶿]/.test(s)) out.push(["bad", "한자가 있습니다. 학생부에는 한자를 쓸 수 없습니다."]);
    if (/[぀-ヿЀ-ӿ]/.test(s)) out.push(["bad", "영어 외 외국어 문자가 있습니다. 한글로 바꿔 쓰세요."]);
    if (/(^|\n)\s*([0-9]+[.)]|[-*•·▪○●□■◆①-⑳])\s/.test(s)) out.push(["warn", "글머리표나 번호 매기기가 있습니다. 문장으로 이어 쓰세요."]);
    if (/대회/.test(s)) out.push(["bad", "'대회'라는 낱말은 수상경력 외 항목에 쓸 수 없습니다."]);
    return out;
  }

  function update() {
    const s = text.value;
    const b = neisBytes(s);
    const max = Number(item.value);
    const t = Math.max(1, Number(target.value) || max);
    $("bytes").textContent = b.toLocaleString();
    $("hangul").textContent = Math.round(b / 3).toLocaleString() + "자";
    $("ratio").textContent = Math.round(b / t * 100) + "%";
    $("maxr").textContent = Math.round(b / max * 100) + "%";
    const fill = $("fill");
    fill.style.width = Math.min(100, b / max * 100) + "%";
    fill.style.background = b > max ? "var(--bad)" : (b > t ? "var(--warn)" : "var(--ok)");

    const msgs = [];
    if (!s.trim()) { $("msgs").innerHTML = ""; return; }
    if (b > max) msgs.push(["bad", "최대 " + max.toLocaleString() + "Byte를 " + (b - max).toLocaleString() + "Byte 넘었습니다."]);
    else if (b > t) msgs.push(["warn", "목표보다 " + (b - t).toLocaleString() + "Byte 깁니다."]);
    else if (b < t * 0.9) msgs.push(["warn", "목표의 90%보다 짧습니다. 의도한 길이인지 확인하세요."]);
    else msgs.push(["ok", "목표 범위(90~100%) 안입니다."]);
    msgs.push(...checks(s));
    $("msgs").innerHTML = msgs.map(([c, m]) => '<li class="' + c + '"></li>').join("");
    [...$("msgs").children].forEach((li, i) => { li.textContent = msgs[i][1]; });
  }

  item.addEventListener("change", () => { target.value = item.value; update(); });
  target.addEventListener("input", update);
  text.addEventListener("input", update);
  update();
</script>
</body>
</html>
